<div class="app-container">
  <!-- Navbar -->
  <nav class="navbar glass-card">
    <div class="navbar-left">
      <div class="logo">
        <span class="logo-icon">🍽️</span>
        <span class="logo-text">Sabor Politécnico</span>
      </div>
    </div>
    
    <div class="navbar-center" *ngIf="currentRole === 'cliente'">
      <a routerLink="/catalog" routerLinkActive="active" class="nav-link">📋 Menú</a>
      <a routerLink="/tracking" routerLinkActive="active" class="nav-link">🚚 Mi Pedido</a>
    </div>

    <div class="navbar-right">

      <div class="user-profile" *ngIf="currentUser">
        <div class="user-info d-none d-md-flex flex-column text-end me-2 align-items-end" style="line-height: 1.2;">
          <span class="fw-semibold text-dark" style="font-size: 0.85rem;">{{ currentUser.nombres }} {{ currentUser.apellidos }}</span>
          <span class="text-secondary text-uppercase" style="font-size: 0.7rem;">{{ currentUser.rol }}</span>
        </div>
        <div class="avatar" [title]="currentUser.correo_electronico">{{ userInitials }}</div>
        <button (click)="logout()" class="btn-logout" title="Cerrar sesión">🚪</button>
      </div>
    </div>
  </nav>

  <!-- Main Body -->
  <div class="main-body">
    <!-- Sidebar for admin / employee -->
    <aside class="sidebar glass-card" *ngIf="currentRole === 'admin' || currentRole === 'empleado'">
      <div class="sidebar-header">
        <h3>Panel {{ currentRole === 'admin' ? 'Admin' : 'Empleado' }}</h3>
      </div>
      <ul class="sidebar-menu">
        <li>
          <a routerLink="/admin/dashboard" routerLinkActive="active" class="sidebar-link">
            <span>📊</span> Dashboard
          </a>
        </li>
        <li>
          <a routerLink="/admin/orders" routerLinkActive="active" class="sidebar-link">
            <span>📦</span> Gestión de Pedidos
          </a>
        </li>
        <!-- Only Admin can manage catalog -->
        <li *ngIf="currentRole === 'admin'">
          <a routerLink="/admin/products" routerLinkActive="active" class="sidebar-link">
            <span>🍔</span> Catálogo de Productos
          </a>
        </li>
      </ul>
    </aside>

    <!-- Main Content Area -->
    <main class="content-area" [class.no-sidebar]="currentRole === 'cliente'">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
