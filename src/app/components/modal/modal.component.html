<div class="modal-backdrop" *ngIf="isOpen" (click)="close()">
  <div 
    class="glass-card modal-container animate-fade-in" 
    [ngClass]="'modal-' + size" 
    (click)="$event.stopPropagation()"
  >
    <!-- Cabecera del Modal -->
    <div class="modal-header">
      <h3>{{ title }}</h3>
      <button class="close-btn" (click)="close()" type="button" title="Cerrar">&times;</button>
    </div>
    
    <!-- Cuerpo del Modal (Proyectado) -->
    <div class="modal-body custom-scrollbar">
      <ng-content select="[modal-body]"></ng-content>
    </div>
    
    <!-- Pie del Modal (Proyectado) -->
    <div class="modal-footer">
      <ng-content select="[modal-footer]"></ng-content>
    </div>
  </div>
</div>
